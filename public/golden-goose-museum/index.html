<style>
:root{--paper:#eef0f1;--ink:#16181a;--grey:#5c6268;--hair:#d2d6d9;--olive:#2f6c8a;--bar:76px;--strip:62px;--glass:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.08) 60%,rgba(255,255,255,.14));--glass-line:transparent;--glass-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.4),inset 1.5px 0 0 rgba(255,214,236,.35),inset -1.5px 0 0 rgba(190,224,255,.4),inset 0 0 18px rgba(255,255,255,.22),inset 0 10px 24px -14px rgba(255,255,255,.7),0 1px 1px rgba(20,30,40,.05),0 18px 44px -18px rgba(20,30,40,.32);--blur:blur(14px) saturate(210%) brightness(1.08) contrast(1.02);--mono:'Funnel Sans',sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:'Funnel Sans',sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}

button{font:inherit;color:inherit}
canvas{display:block;outline:none}
.serif{font-family:'Funnel Display',sans-serif}
.lab{font-family:'Funnel Sans',sans-serif;font-size:13px;font-weight:400;letter-spacing:0;color:var(--grey)}
.num{font-variant-numeric:tabular-nums}

#cover{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:90px 24px 0;box-sizing:border-box;transition:opacity .8s ease;pointer-events:none}

/* loading: a shoebox whose lid lifts with the real progress, then flies off as a glow rises inside */
.sb-box{position:relative;width:min(300px,70vw);aspect-ratio:300/190;--o:0}

.sb-body::before{content:"";position:absolute;inset:-20%;transform:rotate(-10deg);opacity:.7;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path transform='translate(30 30) scale(.4)' d='M50 4 L61 38 L97 38 L68 59 L79 94 L50 73 L21 94 L32 59 L3 38 L39 38 Z' fill='%23c4beb4'/></svg>") 0 0/48px 48px,url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path transform='translate(30 30) scale(.4)' d='M50 4 L61 38 L97 38 L68 59 L79 94 L50 73 L21 94 L32 59 L3 38 L39 38 Z' fill='%23c4beb4'/></svg>") 24px 24px/48px 48px}
.sb-lbl{position:absolute;left:7%;top:20%;width:24%;height:54%;background:#f6f4f0;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.06);display:flex;flex-direction:column;justify-content:space-between;padding:6px 6px 5px;box-sizing:border-box}
.sb-lbl i{display:block;height:2px;background:rgba(20,20,20,.35);border-radius:1px}
.sb-lbl i:nth-child(2){width:70%}.sb-lbl i:nth-child(3){width:85%}
.sb-lbl b{display:block;height:28%;background:repeating-linear-gradient(90deg,#222 0 1px,transparent 1px 2px,#222 2px 4px,transparent 4px 5px,#222 5px 6px,transparent 6px 8px)}
.sb-bag{position:absolute;left:-3%;right:16%;bottom:61%;height:10%;z-index:1;background:#fbfaf7;border-radius:6px 10px 2px 2px;box-shadow:0 1px 2px rgba(0,0,0,.08);transform:rotate(-1.2deg);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:8px;letter-spacing:.18em;color:#2a2a2a;opacity:clamp(0,calc((var(--o) - .12) * 5),1);transition:opacity .4s ease}
.sb-box.open .sb-bag{opacity:0!important}
.sb-glow{position:absolute;left:4%;right:4%;bottom:58%;height:16%;z-index:1;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));opacity:calc(var(--o) * 1.1);filter:blur(4px);transform-origin:50% 100%}
.sb-box.open .sb-glow{opacity:1;animation:sbGlowUp 1.4s cubic-bezier(.2,0,0,1) forwards}
.sb-lid{position:absolute;left:-3%;right:-3%;bottom:56%;height:14%;z-index:3;border-radius:3px;background:linear-gradient(180deg,#ddd9d2,#d1ccc4);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 10px -6px rgba(30,30,30,.35);transform-origin:12% 100%;transform:translate(calc(var(--o) * 4%),calc(var(--o) * -70%)) rotate(calc(var(--o) * -9deg));transition:transform .25s cubic-bezier(.2,0,0,1)}
.sb-lid::before{content:"";position:absolute;inset:0;border-radius:inherit;opacity:.6;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path transform='translate(30 30) scale(.4)' d='M50 4 L61 38 L97 38 L68 59 L79 94 L50 73 L21 94 L32 59 L3 38 L39 38 Z' fill='%23c8c2b8'/></svg>") 10px center/26px 26px no-repeat}
.sb-lid::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.08);border-radius:0 0 3px 3px}
.sb-box.open .sb-lid{transition:transform .6s cubic-bezier(.5,0,.2,1),opacity .35s ease .25s;transform:translate(46%,-300%) rotate(22deg);opacity:0}
.sb-sh{position:absolute;left:2%;right:2%;bottom:-10px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(20,30,40,.2),transparent)}
.sb-quip{min-height:1.4em;font-size:12px;color:var(--grey);text-align:center}
@keyframes sbRattle{0%,62%,100%{transform:none}70%{transform:rotate(-1.6deg) translateY(-1px)}78%{transform:rotate(1.3deg)}86%{transform:rotate(-.6deg)}}

/* error: the box has tipped over and the shoe tumbled out */
#cover.err{pointer-events:auto;background:linear-gradient(180deg,#eceef0,#e2e4e6);gap:8px;padding:24px}
.er-spill{position:relative;width:min(460px,90vw);height:210px}
.er-tip{position:absolute;left:4%;bottom:0;width:200px;height:79px;transform-origin:0 100%;transform:rotate(-8deg)}
.er-tip i{position:absolute;inset:0;border-radius:3px;background:linear-gradient(180deg,#d8d4cd,#cfcac2 60%,#c6c1b8);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 18px 22px -16px rgba(30,30,30,.35)}
.er-lid{position:absolute;left:52%;bottom:2px;width:150px;height:22px;border-radius:3px;background:linear-gradient(180deg,#ddd9d2,#d1ccc4);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 10px -6px rgba(30,30,30,.3);transform:rotate(14deg);transform-origin:0 100%}
.er-shoe{position:absolute;right:0;bottom:34px;width:190px;height:auto;transform:rotate(-24deg);filter:drop-shadow(0 12px 10px rgba(20,30,40,.12));animation:erWob 3s ease-in-out infinite}
.er-bubble{position:absolute;right:30%;top:0;padding:6px 12px;border-radius:8px;background:#fff;font-family:'Funnel Display',sans-serif;font-size:15px;box-shadow:0 6px 14px -8px rgba(20,30,40,.3),inset 0 0 0 1px rgba(20,20,20,.08);transform:rotate(-6deg)}
.er-bubble::after{content:"";position:absolute;left:24px;bottom:-6px;width:10px;height:10px;background:#fff;transform:rotate(45deg)}
.st-msg{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;padding:28px 0}
.st-msg b{font-family:'Funnel Display',sans-serif;font-weight:500;font-size:26px;letter-spacing:-.015em;color:#141414}
.st-msg span{font-size:14px;color:var(--grey);max-width:380px}
.st-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.st-actions button,.st-actions a{all:unset;font-size:14px;color:#141414;background:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(20,20,20,.18)}
.st-actions .ghost{background:transparent}
@keyframes erWob{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(-20deg) translateY(-3px)}}
/* 404: an empty glass pedestal, footprints walking off */
.nf{position:relative;min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 0;overflow:hidden}
.nf-ped{position:relative;width:180px;display:flex;flex-direction:column;align-items:center}
.nf-top{width:100%;height:16px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#f4f3f1,#dcdad6)}
.nf-glass{width:92%;height:190px;background:linear-gradient(90deg,rgba(255,255,255,.55),rgba(255,255,255,.18) 30%,rgba(255,255,255,.08) 60%,rgba(255,255,255,.4));box-shadow:inset 0 0 0 1px rgba(255,255,255,.75)}
.nf-base{width:100%;height:12px;background:#d6d4cf}
.nf-floor{position:absolute;bottom:-14px;width:150%;height:18px;border-radius:50%;background:radial-gradient(closest-side,rgba(20,30,40,.14),transparent)}
.nf-prints{position:absolute;bottom:34%;right:14%;display:flex;gap:26px;transform:rotate(-14deg);opacity:.45}
.nf-prints i{width:12px;height:26px;border-radius:50% 50% 45% 45%;background:#b9bcc0}
.nf-prints i:nth-child(even){transform:translateY(-12px)}
@media (prefers-reduced-motion:reduce){.sb-rattle,.sb-box.open .sb-glow,.er-shoe{animation:none}}

#bar{position:fixed;top:12px;left:12px;right:12px;height:56px;box-sizing:border-box;display:flex;justify-content:space-between;gap:20px;align-items:center;padding:0 20px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0;border-radius:28px;box-shadow:var(--glass-shadow);z-index:20;padding:0 10px 0 26px;isolation:isolate}

#brand{flex:0 1 auto;overflow:hidden;display:flex;align-items:center;gap:14px;cursor:pointer;white-space:nowrap;min-width:0}
#brand b{font-family:'Funnel Display',sans-serif;font-weight:600;font-size:20px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

#nav button i{font-style:normal;font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.04em;opacity:.7}
#nav button:hover{color:var(--ink);background:rgba(255,255,255,.35)}
#nav button.on{color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.55));box-shadow:inset 0 1px 1px #fff,inset 0 -1px 1px rgba(160,170,180,.25),0 4px 12px -4px rgba(20,30,40,.25)}
#facts{padding-right:16px;flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:right;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--grey);white-space:nowrap}

#index{position:fixed;left:0;right:0;width:auto;transform:none;bottom:0;height:78px;box-sizing:border-box;border:0;border-radius:0;background:none;box-shadow:none;z-index:20;display:flex;flex-direction:column;overflow:hidden;transition:transform .5s cubic-bezier(.2,.7,.2,1),opacity .4s}

#index .row{display:flex;justify-content:space-between;gap:16px;padding:8px 28px 2px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 0 8px rgba(255,255,255,.9),0 1px 3px rgba(20,28,36,.7),0 0 1px rgba(20,28,36,.5)}
#cells{flex:1;position:relative;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:0 24px}
.ruler{position:relative;height:100%;min-width:640px}

.ticks .yr{position:absolute;top:calc(100% + 10px);bottom:auto;line-height:1;transition:opacity .3s;transform:translateX(-50%);font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.6)}
.ticks .now{position:absolute;top:18px;bottom:0;width:0;border-left:1.5px dashed var(--olive)}
.ticks .now em{position:absolute;top:2px;right:5px;font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive)}
.cell{all:unset;position:absolute;bottom:0;top:14px;width:28px;margin-left:-14px;cursor:pointer;z-index:2}
.cell::before{content:"";position:absolute;left:50%;bottom:34px;top:24px;width:1px;background:linear-gradient(to top,rgba(22,24,26,.35),rgba(22,24,26,0));transition:background .3s}

.cell .pin{position:absolute;left:50%;bottom:26.5px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 1px rgba(22,24,26,.55);transform:scale(var(--s,1));transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}

#cells{cursor:grab;touch-action:pan-y;user-select:none}

.head{position:absolute;top:0;bottom:30px;width:0;z-index:3;pointer-events:none;opacity:0;transition:left .7s cubic-bezier(.34,1.4,.64,1),opacity .3s}

.mem .in img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05) brightness(1.03);transition:filter .5s}
.mem figure[data-photo-of]:hover img{filter:grayscale(.2) contrast(1.05) brightness(1.03)}
.mem .in i{position:absolute;inset:0;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 72%,rgba(255,255,255,.1))}
.mem .hint{padding:12px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--grey)}
.mem .cap{display:flex;flex-direction:column;margin-top:12px;padding:0 2px}
.mem .t{font-family:'Funnel Display',sans-serif;font-size:15px;line-height:1.3;letter-spacing:-.01em;color:var(--ink);text-wrap:pretty}
.mem .m{padding-top:3px;font-size:11.5px;color:var(--grey)}
.mem .go{margin-top:10px;width:fit-content;font-size:12.5px;color:var(--grey);text-decoration:none;cursor:pointer;transition:color .15s}
.mem .go i{display:inline-block;font-style:normal;transition:transform .15s}
.mem .go:hover{color:var(--ink)}
.mem .go:hover i{transform:translateX(3px)}
@media (max-width:600px){.mem{grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 14px}.mem .t{font-size:13.5px}}
#mapbox{position:relative;border:0;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#eef1f3,#e7eaed);box-shadow:inset 0 1px 0 #fff,0 18px 40px -22px rgba(20,30,40,.3)}
#mapbox svg{display:block;width:100%;height:auto}
#mapcard{position:absolute;background:var(--paper);border:1px solid var(--ink);padding:12px 14px;width:240px;box-sizing:border-box;opacity:0;pointer-events:none;transition:opacity .25s}
#mapcard.on{opacity:1;pointer-events:auto}
#mapcard a{display:block;padding:7px 0;border-top:1px solid var(--hair);text-decoration:none;cursor:pointer}
.links{display:flex;gap:28px;margin-top:28px}
.links a{font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

@media (max-width:1180px){#brand span{display:none}#brand b{font-size:17px}}
@media (max-width:1000px){#facts{display:none}}
@media (max-width:900px){
  :root{--strip:62px}
  #brand span{display:none}
  #nav{gap:2px}#nav button{padding:8px 9px}#nav button i{display:none}
  #facts,#index .row span:last-child{display:none}
  #index{height:72px}
  #panel{top:auto;left:8px;right:8px;bottom:78px;width:auto;height:auto;max-height:232px;overflow:hidden;padding-top:26px!important;touch-action:pan-y;overscroll-behavior:contain;transform:translateY(calc(100% + 140px));transition:transform .5s cubic-bezier(.2,.8,.2,1),max-height .45s cubic-bezier(.2,.8,.2,1),bottom .45s cubic-bezier(.2,.8,.2,1);-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent);touch-action:pan-y}
  #panel.on{transform:none}
  #panel::after{content:"";position:absolute;top:9px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:rgba(22,24,26,.28)}
  #panel::before{content:"";position:sticky;top:-26px;display:block;height:0;margin-top:-26px;padding-top:26px;z-index:2}
  #panel.open{max-height:calc(100% - 88px);bottom:8px;overflow:auto;-webkit-mask-image:none;mask-image:none}
  body:has(#panel.open) #index{opacity:0;pointer-events:none}
  #panel h2{font-size:26px;margin-top:12px}
  #panel .sub{font-size:16px}
  .wrap{padding:92px 16px 64px}
  .ptitle h1{font-size:clamp(32px,9vw,44px)}
  .sec{margin-top:44px}
  .a,.b,.l,.r{grid-column:1/-1}
  .ptitle .lab{padding:0 0 12px}
  .story{column-count:1}
  .photos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ev{grid-template-columns:90px minmax(0,1fr)}.ev .k,.ev .p{display:none}
}
@media (max-width:380px){#brand b{font-size:13px!important}#nav button{font-size:11.5px!important;padding:8px 5px!important}}
@media (max-width:540px){#bar{padding:0 10px;gap:8px}#brand b{font-size:15px;white-space:nowrap}#nav{gap:0}#nav button{font-size:12.5px;padding:8px 7px;letter-spacing:0}.photos,.mem{grid-template-columns:1fr}}
</style>

<body>
<div id="cover" role="status" aria-live="polite">
  <div class="sb-box"><div class="sb-rattle">
    <div class="sb-sh"></div>
    <div class="sb-glow"></div>
    <div class="sb-bag">GOLDEN GOOSE PROPERTY</div>
    <div class="sb-body"><div class="sb-lbl"><i></i><i></i><i></i><b></b></div></div>
    <div class="sb-lid"></div>
  </div></div>
  <div class="sb-quip">Lacing up</div>
</div>
<script>
// The shoebox loader. Fonts and data take the lid to 30%, each pair's models the rest; at 100% the lid
// flies off and a glow rises from inside. A failed model, no WebGL, a script error or 15s without the hall
// all show the tipped-over box instead.
(function () {
  const el = document.getElementById('cover'), box = el.querySelector('.sb-box'), quip = el.querySelector('.sb-quip');
  const QUIPS = ['Lacing up', 'Checking the star still sparkles'], shown = performance.now();
  let qi = 0, prog = 0, expected = null, loaded = 0, alive = false, finished = false, failed = false, reveal = null;
  const set = p => { prog = Math.max(prog, p); box.style.setProperty('--o', (prog / 100).toFixed(3)); };
  const quips = setInterval(() => { quip.textContent = QUIPS[qi = (qi + 1) % QUIPS.length]; }, 1000);
  const t0 = performance.now();
  (function creep() { const k = Math.min(1, (performance.now() - t0) / 600); set(30 * k); if (k < 1 && !finished && !failed) requestAnimationFrame(creep); })();

  const timeout = setTimeout(() => (alive ? finish() : fail()), 15000);

    if (failed || finished) return;
    if (expected !== null) set(30 + 70 * loaded / Math.max(1, expected));
    if (alive && expected !== null && loaded >= expected) finish();
  }

    finished = true; clearTimeout(timeout);

      set(100); clearInterval(quips);

        .replace('#include <common>', '#include <common>\nuniform vec4 uIsBox, uIsBelow, uIsBox2, uIsStar, uIsBand, uIsBlack; uniform float uIsSpeckle, uIsBandW, uIsBlackZ; uniform vec3 uIsBandC; uniform vec3 uIsFill; uniform float uIsSide, uIsDark, uIsArea, uIsGrain, uIsWall, uIsZ, uIsSat, uIsEdge, uIsMatte, uIsFlat, uIsRough, uIsLight; varying vec3 vIsN, vIsP, vIsSideN; float isK = 0.0, isBand = 0.0;\n#define IS_BAND 1')
        .replace('#include <map_fragment>', `#include <map_fragment>
          {
            vec2 gp = vIsP.xy, ba = uIsBelow.zw - uIsBelow.xy;

            if (uIsSat > 0.0) { vec3 c0 = diffuseColor.rgb; float mx = max(c0.r, max(c0.g, c0.b)); k *= smoothstep(uIsSat, uIsSat + 0.15, (mx - min(c0.r, min(c0.g, c0.b))) / max(mx, 0.001)); }
            if (inBox) { isK = max(k, area); diffuseColor.rgb = mix(diffuseColor.rgb, fillC, max(k, area * 0.92)); }

            if (uIsBandW > 0.0 && (vIsP.z * uIsSide > 0.0 || normalize(vIsN).z * uIsSide > 0.1)) {

            }

            // leather whatever way it faces, for the lace flap's underside the scan left as glitter
            if (all(greaterThan(gp, uIsBlack.xy)) && all(lessThan(gp, uIsBlack.zw)) && vIsP.z * uIsSide > uIsBlackZ) {

        // the star is a raised patch, so its edges would still catch the light: shade it as flat side
        .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
          if (isK > 0.0) normal = normalize(mix(normal, normalize(vIsSideN), isK * uIsFlat));`)

        .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>\nroughnessFactor = mix(roughnessFactor, uIsRough, isK * uIsMatte); roughnessFactor = mix(roughnessFactor, 0.35, isBand);`)

    };

  });
}

// The generated laces are lumpy and one runs straight down the tongue, so with `laces` set they are

  });
}

// A badge photographed from the real pair (badge.img), laid on the outer face at badge.at [x, y] with

      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', '#include <common>\nuniform sampler2D uSbMap; uniform vec2 uSbAt, uSbSize; uniform vec3 uSbClear; uniform float uSbOut, uSbClearOn; varying vec3 vSbP, vSbN; varying float vSbFlip;')

// Recolours a patch of a generated shoe, for a pair sharing another pair's model: the texels darker than

      ['u' + n + 'Spark']: { value: patch.sparkle ?? 0 }, ['u' + n + 'Leather']: { value: patch.leather ? 1 : 0 }, ['u' + n + 'Metal']: { value: patch.metal ? 1 : 0 }, ['u' + n + 'Flakes']: { value: patch.flakes ?? 1600 }, ['u' + n + 'Time']: lookTime };
    m.onBeforeCompile = (sh, r) => {

        .replace('#include <common>', `#include <common>\nuniform mat4 u${n}Local; varying vec3 v${n}P;`)
        .replace('#include <begin_vertex>', `#include <begin_vertex>\nv${n}P = (u${n}Local * vec4(position, 1.0)).xyz;`);
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', `#include <common>
          uniform vec4 u${n}Box; uniform vec3 u${n}Col; uniform float u${n}Dark, u${n}Spark, u${n}Flakes, u${n}Time, u${n}Leather, u${n}Metal; varying vec3 v${n}P; float ${n}M = 0.0;
          vec3 ${n}Hash(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yzz) * p3.zyx); }`)
        .replace('#include <map_fragment>', `#include <map_fragment>
          {
            vec2 gp = v${n}P.xy; float l = dot(diffuseColor.rgb, vec3(0.2126, 0.7152, 0.0722));
            if (all(greaterThan(gp, u${n}Box.xy)) && all(lessThan(gp, u${n}Box.zw))) ${n}M = smoothstep(u${n}Dark, u${n}Dark * 0.6, l);
            diffuseColor.rgb = mix(diffuseColor.rgb, u${n}Col * (0.7 + 1.5 * l), ${n}M);

            #endif

        // patch.metal: polished metal, such as a metallic silver heel tab
        .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>\nroughnessFactor = mix(roughnessFactor, 0.7, ${n}M * u${n}Leather); roughnessFactor = mix(roughnessFactor, 0.22, ${n}M * u${n}Metal);`)
        .replace('#include <metalnessmap_fragment>', `#include <metalnessmap_fragment>\nmetalnessFactor = mix(metalnessFactor, 0.0, ${n}M * u${n}Leather); metalnessFactor = mix(metalnessFactor, 0.9, ${n}M * u${n}Metal);`)
        .replace('#include <dithering_fragment>', `#include <dithering_fragment>
          #ifdef USE_MAP
          if (${n}M > 0.01 && u${n}Spark > 0.0) {
            vec2 cell = floor(vMapUv * u${n}Flakes), inCell = fract(vMapUv * u${n}Flakes) - 0.5;
            vec3 r = ${n}Hash(cell), nf = normalize(normal + (r - 0.5) * 2.2), V = normalize(vViewPosition), refl = reflect(-V, nf);
            float flash = pow(max(dot(refl, normalize(vec3(0.4, 0.9, 0.5))), 0.0), 24.0) + pow(max(dot(refl, normalize(vec3(-0.6, 0.3, 0.8))), 0.0), 24.0) + pow(max(dot(refl, V), 0.0), 60.0);

          }
          #endif`);
    };
    m.customProgramCacheKey = () => prevKey() + '-' + n + JSON.stringify(patch.box);
  });
}

// The heel tab's "GOLDEN GOOSE / ★", photographed from a real pair (heel.img, white on transparent) and
// wrapped round the heel: heel.cx is the x of the heel's vertical axis, heel.span [from, to] the angles it
// covers (degrees, 0 = straight back), heel.y / heel.h its middle and height, heel.bend how far the row
// rises at its ends, all in the model's own
// units. heel.clear [y0, y1, from, to] paints the generated lettering out in heel.tab first.
// heel.text: the lettering drawn as type instead of a photo: Marcellus, a flared serif close to the
// tab's own, white on transparent, sized to the band it is wrapped on (heel.aspect: its width / height).
function heelCanvas(heel) {
  const H = 160, W = Math.round(H * (heel.aspect || 7.5)), cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d'), fs = 104;
  c.fillStyle = '#fff'; c.textBaseline = 'middle'; c.font = `400 ${fs}px Marcellus, "Times New Roman", serif`; c.letterSpacing = '6px';
  const parts = heel.text.split('|'), gap = fs * 0.45, star = fs * 0.62;

  const k = Math.min(1, (W - 8) / total); c.setTransform(k, 0, 0, 1, (W - total * k) / 2, 0);
  let x = 0;

  parts.forEach((t, i) => { c.fillText(t, x, H / 2 + 4); c.strokeText(t, x, H / 2 + 4); x += widths[i] + gap; });
  c.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? star * 0.19 : star * 0.48, a = -Math.PI / 2 + i * Math.PI / 5; c.lineTo(x + star / 2 + r * Math.cos(a), H / 2 - 2 + r * Math.sin(a)); } c.closePath(); c.fill();
  return cv;
}
function heelText(root, heel, img) {
  const map = new THREE.Texture(img); map.colorSpace = THREE.SRGBColorSpace; map.anisotropy = 8; map.needsUpdate = true;
  const cl = heel.clear || [9, 9, 0, 0];
  root.traverse(o => {
    if (!o.isMesh) return;
    const m = o.material, prev = m.onBeforeCompile, prevKey = m.customProgramCacheKey.bind(m);
    o.updateMatrix();
    const u = { uHtMap: { value: map }, uHtLocal: { value: o.matrix.clone() }, uHtCx: { value: heel.cx ?? 0.66 },
      uHtSpan: { value: new THREE.Vector2(...heel.span) }, uHtY: { value: new THREE.Vector3(heel.y, heel.h, heel.bend ?? 0) },
      uHtClear: { value: new THREE.Vector4(...cl) }, uHtCol: { value: new THREE.Color(heel.color || '#ffffff') }, uHtTab: { value: new THREE.Color(heel.tab || '#151517') } };
    m.onBeforeCompile = (sh, r) => {

      Object.assign(sh.uniforms, u);
      sh.vertexShader = sh.vertexShader
        .replace('#include <common>', '#include <common>\nuniform mat4 uHtLocal; varying vec3 vHtP, vHtN; varying float vHtFlip;')
        .replace('#include <begin_vertex>', `#include <begin_vertex>
          vHtP = (uHtLocal * vec4(position, 1.0)).xyz; vHtN = mat3(uHtLocal) * normal;
          vHtFlip = sign(dot(cross(modelMatrix[0].xyz, modelMatrix[1].xyz), modelMatrix[2].xyz));`);
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', `#include <common>
          uniform sampler2D uHtMap; uniform float uHtCx; uniform vec2 uHtSpan; uniform vec3 uHtY; uniform vec4 uHtClear; uniform vec3 uHtCol, uHtTab;
          varying vec3 vHtP, vHtN; varying float vHtFlip; float htClear = 0.0;`)
        // cleared straight after the texture is read, so later effects (glitter) never see the old lettering
        .replace('#include <map_fragment>', `#include <map_fragment>
          {
            vec2 d = vec2(vHtP.x - uHtCx, vHtP.z);
            if (d.x > 0.0 && dot(normalize(vHtN.xz), normalize(d)) > 0.2) {
              float a = degrees(atan(d.y, d.x));
              if (vHtP.y > uHtClear.x && vHtP.y < uHtClear.y && a > uHtClear.z && a < uHtClear.w) {
